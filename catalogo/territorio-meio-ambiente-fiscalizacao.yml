  - id: territorio-meio-ambiente-fiscalizacao/anm-cadastro-mineiro-pesquisa-de-processos-minerarios
    nome: ANM - Cadastro Mineiro (Pesquisa de Processos Minerários)
    descricao: Pesquisa de processos minerários por nome do titular, CPF/CNPJ do titular, NUP, município, substância, fase do processo, situação e tipo de título, entre outros filtros, com opção de exportação. Retorna processo, tipo de requerimento, fase atual, CPF/CNPJ e nome do titular, municípios, substâncias, tipos de uso e situação. Possui captcha. O serviço de mapas do SIGMINE retorna, para uma coordenada, o processo, a fase, o nome do titular, a substância, o uso e a área.
    resumo: Links de pesquisa
    links:
      - url: https://sistemas.anm.gov.br/SCM/Extra/site/admin/pesquisarProcessos.aspx
        label: Pesquisar Processos
      - url: https://geo.anm.gov.br/arcgis/rest/services/SIGMINE/dados_anm/MapServer/0/query?geometry={LONGITUDE}%2C{LATITUDE}&geometryType=esriGeometryPoint&inSR=4674&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json
        label: 'SIGMINE: Consulta por Coordenada'
    input: [cnpj, coordenadas, cpf, municipio, nome, numero_processo, razao_social]
    output: [api_json, dados_cadastrais, processo]
    tipo_fonte: federal
    classificacao: override
    observacao: A pesquisa de processos possui captcha; a consulta por coordenada não.
  - id: territorio-meio-ambiente-fiscalizacao/ana-outorgas-de-uso-de-recursos-hidricos-emitidas
    nome: ANA - Outorgas de Uso de Recursos Hídricos Emitidas
    descricao: Relação das outorgas federais de uso da água. A planilha traz número do processo, CPF/CNPJ e nome do requerente, município, UF, corpo hídrico, finalidade, latitude, longitude, resolução, datas de publicação e de vencimento.
    resumo: Links de pesquisa
    links:
      - url: https://www.gov.br/ana/pt-br/assuntos/regulacao-e-fiscalizacao/outorga/outorgas-emitidas
        label: Outorgas Emitidas
      - url: https://www.ana.gov.br/exporta-planilha/outorgas_federais/relatorio_outorgas.csv
        label: Planilha de Outorgas Federais
    input: [nenhum]
    output: [dados_cadastrais, dataset, outorga]
    tipo_fonte: federal
    classificacao: override
    observacao: A planilha contém CPF/CNPJ, nome do requerente e coordenadas do ponto outorgado.
