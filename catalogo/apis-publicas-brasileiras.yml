# Categoria: APIs Públicas Brasileiras
# Fontes na ordem de exibição no README.md. Formato: data/schemas/catalogo.schema.json
# Depois de editar, rode: python3 tools/build_dataset.py
fontes:
  - id: apis-publicas-brasileiras/brasilapi-apis-de-utilidades
    nome: BrasilAPI - APIs de Utilidades
    descricao: Conjunto de APIs públicas e gratuitas com informações sobre CEP, CNPJ, bancos, feriados, ISBN, e outros dados brasileiros.
    links:
      - url: https://brasilapi.com.br/
      - url: https://brasilapi.com.br/docs
        label: Documentação
    input: [cep, cnpj]
    output: [api_json, dados_cadastrais, endereco]
    tipo_fonte: privado
    classificacao: heuristica
    markdown: |-
      **Recursos disponíveis:**
      - Consulta de CEP
      - Informações de bancos
      - Códigos de cidades (IBGE)
      - Feriados nacionais
      - Tabela FIPE
      - ISBN
      - Taxas de câmbio
  - id: apis-publicas-brasileiras/cnj-api-publica-datajud
    nome: CNJ - API Pública DataJud
    descricao: API pública do Conselho Nacional de Justiça para consulta de metadados e movimentações de processos de todos os tribunais, com documentação, exemplos e modelo de dados na wiki.
    links:
      - url: https://datajud-wiki.cnj.jus.br/api-publica/
    input: [numero_processo]
    output: [api_json, movimentacao, processo]
    tipo_fonte: judiciario
    classificacao: override
    observacao: Chave pública de acesso publicada na própria wiki.
  - id: apis-publicas-brasileiras/receitaws-api-cnpj
    nome: ReceitaWS - API CNPJ
    descricao: API gratuita para consulta de informações cadastrais de empresas brasileiras.
    links:
      - url: https://receitaws.com.br/v1/cnpj/
        label: URL Base
        em_markdown: true
    input: [cnpj]
    output: [api_json, cnae, dados_cadastrais, endereco, situacao_cadastral, socios]
    tipo_fonte: privado
    classificacao: override
    observacao: Sem autenticação. Rate limit de 3 requisições por minuto.
    markdown: |-
      <details>
      <summary>Informações da API</summary>

      - **URL Base:** https://receitaws.com.br/v1/cnpj/
      - **Autenticação:** Não requer
      - **Rate Limit:** 3 requisições por minuto
      - **Formato:** JSON

      **Exemplo de uso:**
      ```bash
      curl https://receitaws.com.br/v1/cnpj/00000000000191
      ```

      **Retorna:**
      - Razão social
      - Nome fantasia
      - CNAE
      - Endereço completo
      - Situação cadastral
      - Lista de sócios
      - Capital social

      </details>
  - id: apis-publicas-brasileiras/viacep-api-de-consulta-de-cep
    nome: ViaCEP - API de Consulta de CEP
    descricao: API gratuita para consulta de endereços por CEP.
    links:
      - url: https://viacep.com.br/ws/
        label: URL Base
        em_markdown: true
    input: [cep, endereco, municipio, uf]
    output: [api_json, endereco]
    tipo_fonte: privado
    classificacao: override
    observacao: Sem autenticação e sem limite oficial. Aceita JSON, XML e JSONP.
    markdown: |-
      <details>
      <summary>Informações da API</summary>

      - **URL Base:** https://viacep.com.br/ws/
      - **Autenticação:** Não requer
      - **Formatos:** JSON, XML, JSONP
      - **Limite:** Sem limite oficial

      **Exemplo de uso:**
      ```bash
      curl https://viacep.com.br/ws/01310100/json/
      ```

      **Recursos:**
      - Consulta por CEP
      - Busca por endereço (UF, cidade, logradouro)

      </details>
  - id: apis-publicas-brasileiras/registro-br-api-rdap
    nome: Registro.br - API RDAP
    descricao: Protocolo RDAP para consulta de informações sobre domínios .br.
    links:
      - url: https://rdap.registro.br/
        label: URL Base
        em_markdown: true
      - url: https://registro.br/tecnologia/ferramentas/rdap/
        label: Documentação
        em_markdown: true
    input: [dominio]
    output: [api_json, dados_cadastrais]
    tipo_fonte: privado
    classificacao: override
    observacao: RDAP para domínios .br.
    markdown: |-
      <details>
      <summary>Informações da API</summary>

      - **URL Base:** https://rdap.registro.br/
      - **Documentação:** https://registro.br/tecnologia/ferramentas/rdap/
      - **Formato:** JSON

      **Exemplo de uso:**
      ```bash
      curl https://rdap.registro.br/domain/registro.br
      ```

      **Retorna:**
      - Titular do domínio
      - Data de criação
      - Data de expiração
      - Nameservers
      - Status do domínio

      </details>
  - id: apis-publicas-brasileiras/ibge-api-de-servicos
    nome: IBGE - API de Serviços
    descricao: APIs do IBGE para consulta de informações geográficas, estatísticas e de localidades.
    links:
      - url: https://servicodados.ibge.gov.br/api/docs
        label: Documentação
        em_markdown: true
    input: [cep, cnpj, municipio]
    output: [api_json, estatistica, mapa]
    tipo_fonte: federal
    classificacao: heuristica
    markdown: |-
      <details>
      <summary>Informações da API</summary>

      - **Documentação:** https://servicodados.ibge.gov.br/api/docs
      - **Autenticação:** Não requer
      - **Formato:** JSON, XML

      **Recursos principais:**
      - Localidades (estados, municípios, distritos)
      - Malhas geográficas
      - Agregados do SIDRA
      - Notícias e releases

      **Exemplo - Listar estados:**
      ```bash
      curl https://servicodados.ibge.gov.br/api/v1/localidades/estados
      ```

      </details>
