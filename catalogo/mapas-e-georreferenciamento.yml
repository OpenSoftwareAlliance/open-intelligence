  - id: mapas-e-georreferenciamento/sistema-nacional-de-cadastro-ambiental-rural-sicar-car
    nome: Sistema Nacional de Cadastro Ambiental Rural ( SICAR-CAR )
    descricao: O SICAR é um sistema público de geoprocessamento que mapeia todas as propriedades rurais registradas com o CAR (Cadastro Ambiental Rural). Sendo o CAR um registro público, nacional e obrigatório à todas as propriedades rurais do Brasil, com a finalidade de formar uma base de dados e integrar informações.
    links:
      - url: https://www.car.gov.br/publico/imoveis/index
      - url: https://www.car.gov.br/#/consultar
    input: [car, coordenadas, municipio]
    output: [area_rural, mapa]
    tipo_fonte: federal
    classificacao: heuristica
