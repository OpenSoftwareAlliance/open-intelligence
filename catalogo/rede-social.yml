# Categoria: Rede Social
# Fontes na ordem de exibição no README.md. Formato: data/schemas/catalogo.schema.json
# Depois de editar, abra o pull request: README.md e data/*.json são regenerados no main (veja CONTRIBUICAO.md).
fontes:
  - id: rede-social/linkedin
    nome: LinkedIn
    descricao: É uma rede social de negócios fundada com mais de 750 milhões de usuários.
    links:
      - url: https://www.linkedin.com/jobs/search/?keywords=SEU_ALVO&location=Brasil
    input: [email, nome, telefone]
    output: [perfil_social]
    tipo_fonte: internacional
    classificacao: heuristica
  - id: rede-social/instagram
    nome: Instagram
    descricao: Rede mais utilizada atualmente, ótimo para a busca de imagens por localidade
    links:
      - url: https://www.instagram.com/explore/
      - grupo: Ferramenta para busca de dados no Instagram
        url: https://www.aware-online.com/en/osint-tools/instagram-search-tool/
      - url: https://www.aware-online.com/en/osint-tools/instagram-tools/
    input: [email, nome, telefone]
    output: [perfil_social]
    tipo_fonte: internacional
    classificacao: heuristica
  - id: rede-social/twitter
    nome: Twitter
    descricao: É uma rede social e um servidor para microblogging e é possível uma busca mais efetiva usando sua busca avançada.
    links:
      - url: https://twitter.com/search?q=seu_alvo+lang%3Apt&src=typed_query
        label: seu_alvo lang:pt
        em_markdown: true
      - url: https://twitter.com/search-advanced
        em_markdown: true
    input: [email, nome, telefone]
    output: [perfil_social]
    tipo_fonte: internacional
    classificacao: heuristica
    markdown: |-
      - `seu_alvo lang:pt`
        - https://twitter.com/search?q=seu_alvo+lang%3Apt&src=typed_query
        - https://twitter.com/search-advanced
  - id: rede-social/omnisci-tweetmap-demo
    nome: OmniSci Tweetmap Demo
    descricao: OmniSci é um banco de dados alimentado por GPU (Unidade de Processador Gráfico) e plataforma de visualização projetada para exploração de dados imersiva e ultrarrápida que elimina a desconexão entre o analista e os dados.
    links:
      - url: https://www.omnisci.com/demos/tweetmap
    input: [email, nome, telefone]
    output: [perfil_social]
    tipo_fonte: internacional
    classificacao: heuristica
  - id: rede-social/maptimize-demo-sentiment-analysis-on-tweets
    nome: Maptimize Demo Sentiment Analysis on Tweets
    descricao: Esta página exibe os tweets e geolocalização das últimas 24 horas entregues pela API de fluxo público do Twitter.
    links:
      - url: https://onemilliontweetmap.com/?center=-18.79191774423444
        em_markdown: true
    input: [email, nome, telefone]
    output: [api_json, perfil_social]
    tipo_fonte: internacional
    classificacao: heuristica
    markdown: '- https://onemilliontweetmap.com/?center=-18.79191774423444,-39.33105468750001&zoom=5&search=SEU_ALVO'
