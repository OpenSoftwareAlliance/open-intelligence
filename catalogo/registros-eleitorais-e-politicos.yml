# Categoria: Registros Eleitorais e Políticos
# Fontes na ordem de exibição no README.md. Formato: data/schemas/catalogo.schema.json
# Depois de editar, rode: python3 tools/build_dataset.py
fontes:
  - id: registros-eleitorais-e-politicos/tse-divulgacao-de-candidaturas-e-contas-eleitorais
    nome: TSE - Divulgação de Candidaturas e Contas Eleitorais
    descricao: Sistema de divulgação de candidaturas, contas eleitorais e de prestação de contas.
