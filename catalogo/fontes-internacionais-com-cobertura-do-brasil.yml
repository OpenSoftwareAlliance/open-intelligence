    resumo: Links de pesquisa
    links:
      - url: https://opencorporates.com/companies/us_de
        label: Delaware (EUA)
      - url: https://opencorporates.com/companies/vg
        label: Ilhas Virgens Britânicas
      - url: https://opencorporates.com/companies/pa
        label: Panamá
      - url: https://opencorporates.com/companies/ky
        label: Ilhas Cayman
