# Categoria: Fontes Internacionais com Cobertura do Brasil
# Fontes na ordem de exibição no README.md. Formato: data/schemas/catalogo.schema.json
# Depois de editar, rode: python3 tools/build_dataset.py
fontes:
  - id: fontes-internacionais-com-cobertura-do-brasil/opencorporates-empresas-do-brasil-e-diretores
    nome: OpenCorporates - Empresas do Brasil e Diretores
    descricao: Maior base aberta de empresas do mundo, com a jurisdição br espelhando dados da Receita e milhões de diretores indexados. Permite achar empresas ligadas a um mesmo nome ou endereço dentro e fora do Brasil.
    subsecao: 🏢 Empresas, Offshore e Beneficiário Final
    resumo: Links de pesquisa
    links:
      - url: https://opencorporates.com/companies/br
        label: Empresas com jurisdição Brasil
      - url: https://opencorporates.com/
        label: Busca geral de empresas
      - url: https://www.opencorporates.com/officers
        label: Busca de diretores e administradores
      - url: https://api.opencorporates.com/
        label: API (chave gratuita para uso público)
        uf: PA
    input: [nome, razao_social]
    output: [dados_cadastrais, socios]
    tipo_fonte: internacional
    classificacao: override
    observacao: Versão gratuita limitada.
