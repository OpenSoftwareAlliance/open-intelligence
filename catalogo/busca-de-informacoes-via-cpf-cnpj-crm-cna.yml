  - id: busca-de-informacoes-via-cpf-cnpj-crm-cna/automacao-de-forca-bruta-para-encontrar-cpf-e-nome-completo
    nome: Automação de força Bruta para encontrar CPF e Nome completo
    descricao: 'Este repositório contém duas ferramentas úteis para a manipulação e consulta de CPFs. A primeira ferramenta gera uma lista de CPFs válidos com base em dígitos centrais fornecidos pelo usuário (dígitos que são retornados do pix por exemplo: `***123456**`), enquanto a segunda realiza consultas automáticas de situação cadastral desses CPFs, utilizando um bot automatizado via Selenium para interagir com um site de consulta.'
    links:
      - url: https://github.com/fernandobortotti/CPF-Tools
    input: [cnpj, cpf, nome]
    output: [dados_cadastrais, situacao_cadastral]
    tipo_fonte: internacional
    classificacao: heuristica
  - id: busca-de-informacoes-via-cpf-cnpj-crm-cna/cpf-validador-validacao-e-descoberta-de-cpf-via-trt3
    nome: CPF Validador - Validação e Descoberta de CPF via TRT3
    descricao: Valida CPFs, confirma titularidade pelo nome e descobre o CPF correto a partir de dígitos parciais ou ilegíveis. Resolve CAPTCHA automaticamente via rede neural local (CRNN ~99% de acurácia), sem depender de serviços externos. Expõe as operações como MCP tools para integração com agentes AI.
    links:
      - url: https://github.com/opastorello/cpf-validador
    input: [cnpj, cpf]
    output: [dados_cadastrais, situacao_cadastral]
    tipo_fonte: internacional
    classificacao: heuristica
  - id: busca-de-informacoes-via-cpf-cnpj-crm-cna/busca-nome-usando-cpf-cnpj
    nome: Busca Nome Usando CPF/CNPJ
    descricao: A intenção deste serviço é ajudar você descobrir e confirmar qual a situação cadastral do documento de CPF (Cadastro de Pessoa Física) e/ou CNPJ (Cadastro Nacional da Pessoa Jurídica).
    links:
      - url: https://www.situacao-cadastral.com/
    input: [cnpj, cpf]
    output: [dados_cadastrais, situacao_cadastral]
    tipo_fonte: privado
    classificacao: heuristica
  - id: busca-de-informacoes-via-cpf-cnpj-crm-cna/retornando-nome-completo-cpf-cnpj
    nome: Retornando Nome Completo CPF/CNPJ
    descricao: Neste serviço é possível descobrir o nome completo utilizando CPF (Cadastro de Pessoa Física) e/ou CNPJ (Cadastro Nacional da Pessoa Jurídica). Bem como, consultar Certidão Eletrônica de Ações Trabalhistas - CEAT. Em escolha ao CPNJ poder ser que retorne o CPF como complemento ao nome.
    links:
      - url: https://sistemas.trt3.jus.br/certidao/feitosTrabalhistas/aba1.emissao.htm
    input: [cnpj, cpf, nome]
    output: [certidao, dados_cadastrais, situacao_cadastral]
    tipo_fonte: judiciario
    classificacao: heuristica
  - id: busca-de-informacoes-via-cpf-cnpj-crm-cna/visualizacao-de-dados-publicos-de-cnpj
    nome: Visualização de dados públicos de CNPJ
    descricao: Ferramenta para observar o relacionamento entre empresas e sócios, a partir dos dados públicos disponibilizados pela Receita Federal. Pode ser executado localmente, baixando o código do Github ou executado online diretamente no site do projeto.
    links:
      - url: https://www.redecnpj.com.br/rede/
      - url: https://github.com/rictom/rede-cnpj/
    input: [cnpj, cpf]
    output: [dados_cadastrais, situacao_cadastral, socios]
    tipo_fonte: privado
    classificacao: heuristica
