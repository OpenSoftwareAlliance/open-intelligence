    descricao: Informações acerca de estabelecimentos e profissionais de saúde.
    links:
      - url: https://cnes.datasus.gov.br/
    input: [cnes, municipio]
    output: [dados_cadastrais]
    tipo_fonte: federal
    classificacao: heuristica
